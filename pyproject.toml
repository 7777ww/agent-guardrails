[project]
name = "agent-guardrails"
version = "0.2.0"
description = "Shared, enforced code constraints for AI coding agents (Python)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.8",
    "ast-grep-cli>=0.30",
    "import-linter>=2.1",
]

[project.scripts]
agent-guardrails = "agent_guardrails.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardrails"]

[tool.agent-guardrails]
enabled = true
