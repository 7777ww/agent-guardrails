# 共用 Ruff 基礎規則。由 `agent-guardrails check` 以 --config 強制套用，
# 專案自己的 pyproject.toml 無法放寬這裡的設定。要改規則請改這個 repo 並發新版。
line-length = 100

[lint]
select = [
    "E", "W", "F", "I", "N", "UP",
    "B", "C4", "SIM", "RET", "ARG",
    "ANN", "S", "BLE", "TRY",
    "PTH", "DTZ", "T20",
    "ERA", "PGH", "TID",
    "C90", "PLC", "PLE", "PLR", "RUF",
]
ignore = [
    "S603",
    "RUF001", "RUF002", "RUF003",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5

# 這裡的 pattern 必須與執行目錄無關：以 --config 套用時，相對 pattern 會被錨定在
# 當下的工作目錄，從別的目錄檢查同一個檔案就會失效。因此用絕對 glob 加上檔名比對。
[lint.per-file-ignores]
"/**/tests/**" = ["S101", "PLR2004", "ARG001"]
"test_*.py" = ["S101", "PLR2004", "ARG001"]
"conftest.py" = ["S101", "PLR2004", "ARG001"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"os.system".msg = "禁止 os.system。請用 subprocess.run([...], check=True) 並以 list 傳參數，不要經過 shell。"
"os.popen".msg = "禁止 os.popen。請用 subprocess.run([...], capture_output=True, check=True)。"
"typing.cast".msg = "禁止 typing.cast：它只是讓 type checker 閉嘴。請修正上游型別，或用 isinstance 做 runtime narrowing。"
"pickle".msg = "禁止 pickle（反序列化不可信資料等於 RCE）。請用 json 或有 schema 的格式。"
